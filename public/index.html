<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Listening House</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #000;
      color: #00ff00;
      font-family: 'Courier New', monospace;
      overflow-x: hidden;
    }
    
    #container {
      padding: 20px;
      min-height: 100vh;
      overflow-y: auto;
    }
    
    .line {
      margin: 8px 0;
      padding: 8px 0;
      animation: fadeIn 0.3s ease-in;
    }
    
    .timestamp {
      color: #555;
      margin-right: 10px;
      font-size: 0.85em;
    }
    
    .text {
      color: #00ff00;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    #container::-webkit-scrollbar {
      width: 8px;
    }
    
    #container::-webkit-scrollbar-track {
      background: #111;
    }
    
    #container::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
